name: Sincronizar productos Texora
on:
  schedule:
    - cron: '15 10 * * *'   # todos los días a las 07:15 hora de Chile (verano)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sync-texora
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Sin "continue-on-error": si Texora no responde, la ejecución queda en rojo y GitHub avisa por correo.
      - run: node scripts/sync-texora.mjs
        env:
          TEXORA_PROXY: ${{ secrets.TEXORA_PROXY }}
          TEXORA_PROXY_KEY: ${{ secrets.TEXORA_PROXY_KEY }}
          TEXORA_EMAIL: ${{ secrets.TEXORA_EMAIL }}
          TEXORA_PASSWORD: ${{ secrets.TEXORA_PASSWORD }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/texora.js
          git diff --cached --quiet || git commit -m "Actualiza productos y disponibilidad desde Texora"
          git push
